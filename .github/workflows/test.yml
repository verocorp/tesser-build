name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt (must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: tessercheck on examples/ddd (dogfood the consumer configuration)
        # examples/ddd is the acceptance-gate output and the canonical worked
        # example consumers imitate; running tessercheck on it with its own
        # .tesser-build.yaml exclude list exercises the exact consumer setup and
        # keeps the example from silently drifting out of conformance.
        run: go run ./cmd/tessercheck ./examples/ddd/

  plugin:
    # Proves gclplugin/ actually bundles into a golangci-lint v2 custom binary
    # and the tessercheck linter runs end-to-end — the editor-integration path that
    # `go test ./...` cannot exercise (no golangci-lint on PATH there, so the
    # TestCustomGCL test skips in the job above and runs only here).
    name: golangci-lint plugin bundling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Plugin bundling smoke test
        run: go test ./gclplugin/ -run CustomGCL -v

  python-example:
    # Gates the Python worked example at the same bar as the Go mechanics:
    # mypy --strict and pytest must both be clean, so skills/tesser-build/python.md never
    # encodes a pattern that isn't backed by running, type-checked code.
    # examples/python is the reference rendering.
    name: python example (mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/python/requirements-dev.txt
      - name: examples/python — mypy --strict + pytest
        run: scripts/verify python

  spike-shells:
    name: spike-shells (tessercheck zero findings + mypy --strict + pytest + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/spike-shells/requirements-dev.txt
      - name: examples/spike-shells — tessercheck + mypy --strict + pytest + import contracts
        run: scripts/verify spike-shells

  spike-llmport:
    # Gates the LLM tool-call port spike at the spike-shells bar: tessercheck
    # zero findings over the whole tree (the srv-vocabulary + wire-module
    # rules resolved the two findings the ratchet used to carry), then
    # mypy --strict + pytest on the pure modules, including the srv router
    # (it imports no livekit). srv/voice/agent.py is in tessercheck's walk
    # (pure AST) but outside the mypy crawl — livekit-agents is not
    # installed in CI; the spike README records that boundary.
    name: spike-llmport (tessercheck + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/spike-llmport/requirements-dev.txt
      - name: examples/spike-llmport — tessercheck + mypy --strict + pytest
        run: scripts/verify spike-llmport

  python-app-example:
    # Gates the composition-root / wiring worked example (Python) at the same bar:
    # mypy --strict + pytest, now with the two linters that own its architecture
    # rules. Proves the bounded-context anatomy + srv/config/bootstrap model in
    # running, type-checked code before it is taught. The rules split by who can
    # decide them: ruff owns the env edge and the exit edge, import-linter owns
    # the import direction, and the example's own AST tests keep what no tool
    # covers (import-time side effects, host-routes-never-translates, context
    # discovery). A Go mirror (examples/app) is planned, not yet built.
    name: python-app example (ruff + import-linter + mypy --strict + pytest + sigcheck ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/python-app/requirements-dev.txt
      - name: examples/python-app — ruff + import-linter + mypy --strict + pytest + sigcheck ratchet
        # The sigcheck step is a ratchet, not a zero-findings gate: the
        # import-totality wave landed after this tree reached zero, so
        # examples/python-app/sigcheck-ratchet carries the accepted debt until
        # the conformance wave burns it down (TODOS.md "Import-totality wave
        # followups"). The gate logic and how to regenerate the baseline live
        # in scripts/sigcheck-ratchet.
        run: scripts/verify python-app

  serdepy-example:
    # Gates the serialization-norm worked example (Python) at the same bar:
    # mypy --strict + pytest. Shows every canonical-exit case in running code
    # (all four conversion dunders, the Decimal and datetime text policies,
    # zero-dunder compound, parts with a derived field diverging from the
    # spec, an edge golden) — the all-cases companion to python-app's
    # production-shaped parts impl.
    name: serdepy example (mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/serdepy/requirements-dev.txt
      - name: examples/serdepy — mypy --strict + pytest
        run: scripts/verify serdepy

  errorspy-example:
    # Gates the error-norms worked example (Python) at the same bar: mypy
    # --strict + pytest. Proves the error-handling conventions in running,
    # type-checked code before they are taught. A Go mirror (examples/errorsgo)
    # is in progress on branch errorsgo-mirror, not yet on main.
    name: errorspy example (mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/errorspy/requirements-dev.txt
      - name: examples/errorspy — mypy --strict + pytest
        run: scripts/verify errorspy

  tesser-py:
    name: tesser-py runtime library (mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r tesser-py/requirements-dev.txt
      - name: tesser-py — mypy --strict + pytest + the built wheel ships every subpackage
        # The wheel check is not redundant with the type/test gates: the
        # enumerated packages list once silently dropped tesser.testing and
        # tesser.srv, and every other job reaches the source via PYTHONPATH, so
        # only building the distribution can catch that omission class.
        run: scripts/verify tesser-py

  vobase-example:
    name: vobase example (mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r examples/vobase/requirements-dev.txt
      - name: examples/vobase — mypy --strict + pytest
        run: scripts/verify vobase

  roadmap:
    # The roadmap matrix is generated, never hand-maintained (Wave 2 item 10):
    # this job fails when the committed rendering drifts from the derivation,
    # when a tb-cell/tb-status annotation is malformed, when a stub doc lacks
    # the 2A disclaimer, when a living surface references a nonexistent path,
    # or when a skill doc / check code / analyzer exists that no registry row
    # claims (the totality guard — see docs/skill-authoring.md). Needs Go (the
    # analyzers.All JSON bridge) and Python (the stdlib-only generator + its
    # 6A test suite).
    name: roadmap (generated matrix + annotation checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r tessercheck-py-legacy/requirements-dev.txt
      - name: Generated roadmap is current (drift check)
        run: python3 roadmap/generate.py --check
      - name: roadmap generator — mypy --strict + pytest
        working-directory: roadmap
        run: |
          MYPYPATH=../tessercheck-py-legacy mypy --strict generate.py tests/test_generate.py
          pytest tests -q

  tessercheck-py:
    # The merged analyzer (the sigcheck engine, graduated): self-check over its
    # own tree, the RULES.md drift gate, mypy --strict, pytest, and the import
    # contracts — the same bar spike-shells held it to before the move.
    name: tessercheck-py (self-check + RULES.md drift + mypy --strict + pytest + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r tessercheck-py/requirements-dev.txt
      - name: tessercheck-py — self-check + RULES.md drift + mypy --strict + pytest + import contracts
        run: scripts/verify tessercheck-py

  tessercheck-py-legacy:
    # The pre-merge analyzer, parked while examples/python, serdepy, errorspy,
    # and python-app's domain are still frozen-dataclass trees — its checks are
    # what validate them. PR 5 of the merge plan migrates those trees to the
    # shells and deletes this directory and this job.
    #
    # mypy + pytest, then the four CLI gates that run the LEGACY analyzer
    # over the example trees: examples/python, the --app-root full gate on
    # examples/python-app (discovery must find campaign, linkpolicy, reports
    # with zero configuration; discovery errors exit 2), examples/serdepy,
    # and examples/errorspy. Those four are why this job can fail on a change
    # that touches no file under tessercheck-py-legacy — a layout change in
    # python-app broke discovery in PR #56 exactly that way.
    name: tessercheck-py-legacy (mypy --strict + pytest + the four CLI gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev tooling
        run: pip install -r tessercheck-py-legacy/requirements-dev.txt
      - name: tessercheck-py-legacy — mypy --strict + pytest + the four CLI gates
        run: scripts/verify tessercheck-py-legacy
