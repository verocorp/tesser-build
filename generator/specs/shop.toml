app_name = "shop"
bounded_context_name = "orders"
aggregate_root_class_name = "PurchaseOrder"
durable_execution_engine = "restate"
database = "postgres"
identity_field_name = "order_id"
identity_port_operation_name = "issue_order_id"

[aggregate_fields]
customer_name = "str"
quantity = "int"
sku = "str"

[sample_values]
order_id = ["order-1", "order-2"]
customer_name = ["Ada", "Grace"]
quantity = [1, 2]
sku = ["SKU-1", "SKU-2"]

[client]
write_operation_name = "place_order"
read_operation_name = "get_order"
read_response_fields = ["order_id", "customer_name", "quantity"]

[orchestrator]
operation_name = "fulfil_order"

[action]
operation_name = "record_order"

[repository]
save_operation_name = "save_order"
load_operation_name = "load_order"
load_response_collection_name = "orders"

[acceptance_test]
test_class_name = "TestPlacingOrders"
test_method_name = "test_a_placed_order_is_read_back_with_its_quantity"
asserted_field = "quantity"
random_values = [3, 5, 8, 13]

[environment_variables]
storage_url = "ORDERS_STORAGE"
restate_ingress_url = "RESTATE_INGRESS"
