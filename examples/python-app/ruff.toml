# The architecture rules ruff already enforces better than a hand-written AST
# walk could — the environment is read only at the host edge, and only the edge
# exits — plus dead imports, which the example tree should not teach. Selected
# explicitly, one code at a time: nothing in ruff's default set is on, so every
# rule here is a decision someone made on purpose.
#
# `banned-api` matches attribute access AND the `from os import getenv` alias
# form, which is why it replaced `_env_reads` in tests/test_enforcement.py: the
# hand-written detector only saw `os.getenv(...)`.
#
# `target-version` is the permissive floor (3.11), not CI's interpreter (3.12).
# Neither TID251 nor PLR1722 is version-gated, and consumers copy this tree.
#
# Teeth: tests/test_architecture_teeth.py injects violations and asserts this
# config still fails on them. A widened `per-file-ignores` is otherwise a
# silent hole — the rule stops firing and CI stays green.

target-version = "py311"

[lint]
select = ["TID251", "PLR1722", "F401"]

[lint.flake8-tidy-imports.banned-api]
"os.getenv" = { msg = "read the environment only in srv/*/main.py — pass values inward as a Config (skills/tesser-build/bootstrap.md)" }
"os.environ" = { msg = "read the environment only in srv/*/main.py — pass values inward as a Config (skills/tesser-build/bootstrap.md)" }
"sys.exit" = { msg = "exit only from srv/*/main.py — everything below returns or raises (skills/tesser-build/srv.md)" }
"os._exit" = { msg = "exit only from srv/*/main.py — everything below returns or raises (skills/tesser-build/srv.md)" }

# The host edge is the one place both rules are lifted: it decodes the
# environment into a Config and it is the only frame that may exit. `srv/*/main.py`
# does not cross a directory separator, so a deeper module never inherits the
# exemption. Bare `exit`/`quit` stay banned everywhere via PLR1722 — they are
# site builtins, never the edge's exit.
[lint.per-file-ignores]
"srv/*/main.py" = ["TID251"]
