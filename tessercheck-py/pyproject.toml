[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tessercheck-py"
version = "0.2.0"
description = "The tesser-build construction analyzer for Python: declare-then-verify over the tesser shell classes"
requires-python = ">=3.10"
dependencies = ["tesser"]

[tool.setuptools]
packages = [
    "tessercheck",
    "tessercheck.domain",
    "tessercheck.application",
    "tessercheck.adapters",
    "tessercheck.adapters.handlers",
    "tessercheck.adapters.repositories",
    "tessercheck.client",
    "tessercheck.wiring",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["bootstrap", "protocol", "tessercheck", "srv"]

[tool.mypy]
strict = true
files = ["tessercheck", "srv", "bootstrap", "protocol"]
