[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tessercheck-py"
version = "0.4.0"
description = "The tesser-build construction analyzer for Python: declare-then-verify over the tesser shell classes"
requires-python = ">=3.12"
dependencies = ["tesser==0.1.0"]

[tool.setuptools]
packages = [
    "app",
    "protocol",
    "srv",
    "srv.cli",
    "tessercheck.adapters.handlers",
    "tesserinspect",
    "tesserinspect.domain",
    "tesserinspect.application",
    "tesserinspect.application.ports",
    "tesserinspect.adapters",
    "tesserinspect.adapters.repositories",
    "tesserinspect.adapters.handlers",
    "tesserinspect.client",
    "tesserinspect.component",
    "tessercheck",
    "tessercheck.domain",
    "tessercheck.application",
    "tessercheck.application.ports",
    "tessercheck.adapters",
    "tessercheck.adapters.repositories",
    "tessercheck.client",
    "tessercheck.component",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app", "protocol", "tessercheck", "tesserinspect", "srv"]

[tool.mypy]
strict = true
files = ["tessercheck", "tesserinspect", "srv", "app", "protocol"]
