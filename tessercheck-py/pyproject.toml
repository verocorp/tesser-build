[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tessercheck-py"
version = "0.2.0"
description = "The tesser-build construction analyzer for Python: declare-then-verify over the tesser shell classes"
requires-python = ">=3.10"
dependencies = ["tesser"]

[project.scripts]
tessercheck = "tessercheck.__main__:main"

[tool.setuptools]
packages = [
    "tessercheck",
    "tessercheck.domain",
    "tessercheck.application",
    "tessercheck.adapters",
    "tessercheck.client",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tessercheck/tests"]

[tool.mypy]
strict = true
files = ["tessercheck", "rules.py"]
