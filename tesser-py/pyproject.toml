[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesser"
version = "0.1.0"
description = "Runtime library for the tesser-build domain-construction conventions (Python)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["tesser*"]

[tool.setuptools.package-data]
tesser = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["tesser", "tests"]
# The mutmut fixture projects are standalone mutation targets, each shipping
# its own `vo` package — checking them here would collide on the module name.
exclude = ['tests/ecosystem/mutmut/fixtures/']
